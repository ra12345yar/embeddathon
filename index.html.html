<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Embedathon 2K26</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Racing+Sans+One&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="app-css">
/* Layout: the poster as a page. White ground, orange speed-stripes in two corners, a slanted heavy wordmark, then facts, banners and zones. */
:root{
  --bg:#ffffff; --surface:#ffffff; --soft:#f3f5fa; --ink:#0d1b3d; --ink-dim:#4a5878; --line:#d9deea;
  --orange:#f26a1b; --orange-2:#ff9a1f; --orange-text:#c4480a; --on-orange:#0d1b3d;
  --red:#d9262b; --yellow:#ffc21a; --navy:#0b1633; --on-navy:#f4f6fb; --on-navy-dim:#a9b8d8;
  --stripe:#0d1b3d; --ok:#168a4d; --ok-navy:#3ddc84;
  --led:#ff7a1a; --led-off:rgba(255,122,26,.13);
  --f-display:"Kanit",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Barlow",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080f22; --surface:#0f1a36; --soft:#0b1530; --ink:#f4f6fb; --ink-dim:#a9b8d8; --line:#27386a;
    --orange:#ff7a2b; --orange-text:#ff9a52; --navy:#050b1a; --stripe:#27386a; --ok:#3ddc84;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080f22; --surface:#0f1a36; --soft:#0b1530; --ink:#f4f6fb; --ink-dim:#a9b8d8; --line:#27386a;
  --orange:#ff7a2b; --orange-text:#ff9a52; --navy:#050b1a; --stripe:#27386a; --ok:#3ddc84;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  position:relative;overflow-x:hidden;
  background:var(--bg);color:var(--ink);
  font:500 17px/1.55 var(--f-body);
  padding-inline:clamp(16px,4vw,48px);padding-block:0 48px;margin:0;
}
a{color:var(--orange-text)}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;position:relative;z-index:1}
.label{font:600 13px/1.2 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim)}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* corner speed-stripes */
.corner{position:absolute;width:clamp(80px,15vw,170px);aspect-ratio:1;pointer-events:none;z-index:0;
  background:linear-gradient(225deg,var(--stripe) 0 16%,transparent 16% 24%,var(--orange) 24% 40%,transparent 40% 48%,var(--orange-2) 48% 58%,transparent 58%)}
.corner.tr{top:0;right:0}
.corner.bl{bottom:0;left:0;transform:rotate(180deg)}


/* Projector layout: one screen, three fixed zones (title, chip + timer, top 5 band). Nothing moves when results appear. */
html,body,#app{height:100%}
body{padding:0;overflow-x:hidden}
.corner{width:clamp(56px,8vw,120px)}
.screen{--W:min(35vw,44vh);position:relative;z-index:1;height:100%;min-height:560px;display:grid;grid-template-rows:auto minmax(0,1fr) clamp(180px,27vh,260px);gap:clamp(10px,2vh,24px);padding:clamp(12px,2.4vh,28px) clamp(16px,2.4vw,40px)}
h1,h2,h3,ol,p{margin:0}
ol{padding:0;list-style:none}

/* chip + timer */
.main{display:grid;grid-template-columns:var(--W) minmax(0,1fr);gap:clamp(12px,2vw,32px);min-height:0}
.plate{display:flex;flex-direction:column;gap:clamp(6px,1.4vh,14px);min-height:0;min-width:0;background:#fff;border:2px solid var(--line);border-radius:14px;padding:clamp(10px,1.6vh,18px) clamp(10px,1.2vw,18px);overflow:hidden}
.college{flex:none}
.wordmark{flex:none;width:100%;font-size:0}
.board-img{flex:1 1 0;min-height:60px;width:100%;background-position:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.timer{container-type:inline-size;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,2.2vh,28px);padding:clamp(14px,2.4vh,32px) clamp(14px,2vw,32px);min-height:0;margin:0}
.zone-head{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap}
.clockzone{background:var(--navy);color:var(--on-navy);border-top:6px solid var(--orange);border-radius:4px}
.clockzone .label{color:var(--on-navy-dim)}
.status{display:flex;align-items:center;gap:10px}
.led{width:13px;height:13px;border-radius:50%;background:var(--on-navy-dim)}
.led.running{background:var(--ok-navy);box-shadow:0 0 10px var(--ok-navy)}
.led.paused{background:var(--yellow);box-shadow:0 0 10px var(--yellow)}
.led.ended{background:var(--red);box-shadow:0 0 12px var(--red)}
.badge{font:700 11px var(--f-body);letter-spacing:.16em;background:var(--yellow);color:#241a00;padding:3px 8px;border-radius:2px}
.seven{display:flex;align-items:center;justify-content:center;gap:min(1.4cqw,2vh);padding:min(2cqw,2.4vh) 8px;background:rgba(0,0,0,.35);border-radius:2px}
.seven svg.d{width:9vw;width:min(12.4cqw,10.5vh);height:auto;flex:0 1 auto;min-width:0}
.seg{fill:var(--led-off)}
.seg.on{fill:var(--led);filter:drop-shadow(0 0 6px rgba(255,122,26,.6))}
.colon{display:flex;flex-direction:column;gap:min(4cqw,6vh)}
.colon i{display:block;width:min(1.6cqw,2.4vh);height:min(1.6cqw,2.4vh);min-width:5px;min-height:5px;background:var(--led);border-radius:1px;box-shadow:0 0 8px rgba(255,122,26,.6)}
.seven.ended .seg.on{animation:blink 1s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.25}}
.mem{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.mem span{height:clamp(10px,1.8vh,18px);background:rgba(255,255,255,.08);position:relative;overflow:hidden;transform:skewX(-20deg)}
.mem span i{position:absolute;inset:0;background:linear-gradient(90deg,var(--orange),var(--orange-2));transform-origin:left;transform:scaleX(0)}
.meta{display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;font:600 clamp(14px,2.2vh,22px) var(--f-body);letter-spacing:.04em;color:var(--on-navy-dim)}

/* top 5 band */
.bandwrap{display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;min-height:0}
.bandhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px 20px;flex-wrap:wrap}
.bandhead h2{color:var(--orange-text);font-weight:700}
.band{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:clamp(8px,1vw,16px);min-height:0}
.cell{display:flex;flex-direction:column;justify-content:space-between;gap:6px;padding:clamp(8px,1.4vh,16px) clamp(10px,1vw,18px);background:var(--soft);border:1px solid var(--line);border-top:5px solid var(--orange);border-radius:3px;min-width:0;min-height:0;overflow:hidden}
.cell .tx{display:flex;flex-direction:column;gap:4px;min-width:0}
.cell .rk{font:400 clamp(26px,5.2vh,58px)/1 var(--f-display);color:var(--orange-text)}
.cell h3{font:400 clamp(15px,2.7vh,30px)/1.1 var(--f-display);text-transform:uppercase;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell .pj{color:var(--ink-dim);font-size:clamp(13px,1.9vh,19px);line-height:1.2;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell .mb{color:var(--ink-dim);font-size:clamp(12px,1.6vh,16px);overflow-wrap:anywhere}
.cell.first{background:linear-gradient(100deg,var(--orange),var(--orange-2));border-color:var(--orange);color:var(--on-orange)}
.cell.first .rk,.cell.first .pj,.cell.first .mb{color:var(--on-orange)}
.cell.first h3{font-size:clamp(18px,3.4vh,38px)}
.cell.locked h3{height:1.1em;width:min(75%,240px);background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 11px)}
.cell.locked .pj{height:.8em;width:min(45%,140px);background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 9px)}
.cell.first.locked h3,.cell.first.locked .pj{background:repeating-linear-gradient(90deg,rgba(13,27,61,.35) 0 8px,transparent 8px 11px)}
@media (prefers-reduced-motion:no-preference){
  .cell.reveal{animation:rise .8s backwards;animation-delay:calc(var(--d)*1s)}
  @keyframes rise{from{opacity:0;transform:translateY(26px) skewX(-6deg)}}
}
@media (min-width:1500px){.label{font-size:16px}}

/* dock + organizer drawer */
.dock{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;gap:8px;transition:opacity .4s}
body.idle .dock{opacity:0;pointer-events:none}
body.idle{cursor:none}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:700 14px var(--f-body);letter-spacing:.12em;text-transform:uppercase;background:var(--surface);color:var(--orange-text);border:2px solid var(--orange);padding:10px 16px;cursor:pointer;border-radius:2px}
.btn:hover{background:rgba(242,106,27,.14)}
.btn.primary{background:var(--orange);color:var(--on-orange)}
.btn.primary:hover{background:var(--orange-2)}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn.armed{background:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.drawer{position:fixed;top:0;bottom:0;right:0;z-index:30;width:min(620px,100vw);overflow:auto;background:var(--surface);color:var(--ink);border-left:4px solid var(--orange);padding:calc(20px + env(safe-area-inset-top,0px)) 20px 28px;visibility:hidden;transform:translateX(100%);transition:transform .25s,visibility 0s .25s}
.drawer.open{visibility:visible;transform:none;transition:transform .25s,visibility 0s}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dhead h2{font:400 24px var(--f-display);text-transform:uppercase}
.pgrid{display:grid;gap:24px;margin-top:20px}
.tgrid{display:grid;gap:10px}
.trow{display:grid;grid-template-columns:30px repeat(3,minmax(0,1fr));gap:8px;align-items:center}
.trow b{font:400 22px var(--f-display);color:var(--orange-text)}
input[type=text],select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:10px;font:500 16px var(--f-body);border-radius:2px;min-width:0}
input::placeholder{color:var(--ink-dim);opacity:.8}
.msg{font:500 14px var(--f-body);color:var(--ink-dim);min-height:1.4em}

/* phones and portrait screens: stack and scroll */
@media (max-width:900px),(max-aspect-ratio:1/1){
  .college{max-height:none}
  .screen{height:auto;min-height:100%;grid-template-rows:auto auto auto}
  .screen{--W:100%}
  .main{grid-template-columns:1fr}
  .plate{padding:10px}
  .board-img{flex:none;aspect-ratio:550/350;min-height:0}
  .seven svg.d{width:12.4cqw}
  .colon{gap:4cqw}
  .band{grid-template-columns:1fr}
  .cell{flex-direction:row;align-items:center;gap:14px;border-top-width:1px;border-left:5px solid var(--orange)}
  .cell>div.tx{min-width:0;flex:1}
  .cell h3{font-size:20px}.cell.first h3{font-size:24px}
  .cell .rk{font-size:36px}
  .trow{grid-template-columns:26px minmax(0,1fr)}
  .trow input:nth-of-type(n+2){grid-column:2}
}

var DIGITS = ['abcdef', 'bc', 'abged', 'abgcd', 'fgbc', 'afgcd', 'afgedc', 'abc', 'abcdefg', 'abcdfg'];
function buildDigit() {
  var svg = sv('svg', { viewBox: '0 0 60 100', 'class': 'd', 'aria-hidden': 'true' });
  Object.keys(SEGS).forEach(function (k) {
    var p = sv('polygon', { points: SEGS[k].map(function (q) { return q.join(','); }).join(' '), 'class': 'seg' });
    p.setAttribute('data-s', k);
    svg.appendChild(p);
  });
  return svg;
}
function setDigit(svg, n) {
  var on = DIGITS[n];
  var segs = svg.querySelectorAll('.seg');
  for (var i = 0; i < segs.length; i++) {
    segs[i].classList.toggle('on', on.indexOf(segs[i].getAttribute('data-s')) >= 0);
  }
}


function $(s) { return document.querySelector(s); }
var R = { phase: null, live: false, last: [], endsText: '' };

function seenKey() { return 'embd_seen_' + (S.revealId || 0); }
function alreadySeen() { try { return sessionStorage.getItem(seenKey()) === '1'; } catch (e) { return false; } }
function markSeen() { try { sessionStorage.setItem(seenKey(), '1'); } catch (e) {} }

/* one screen: title, chip, timer, and a top 5 band whose space is reserved from the start */
function renderShell() {
  $('#app').innerHTML =
    '<div class="screen">' +
    '<header class="topbar"><div class="college" role="img" aria-label="Sasurie College of Engineering (Autonomous), Vijayamangalam, Tiruppur - 638056, with NAAC, AICTE, Institution\'s Innovation Council and PMG Trust marks"></div></header>' +
    '<div class="main">' +
    '<aside class="plate">' +
    '<h1 class="wordmark"><span class="sr">Embedathon 2K26. Design, Build, Innovate.</span></h1>' +
    '<div class="board-img" role="img" aria-label="Embedded development board with a wireless module"></div></aside>' +
    '<section class="timer clockzone" id="clock"><div class="zone-head"><span class="label">Time remaining</span>' +
    '<div class="status"><span class="led" id="led"></span><span class="label" id="stxt"></span><span class="badge" id="rbadge" hidden>REHEARSAL</span></div></div>' +
    '<div class="seven" id="seven" role="timer"></div><div class="mem" id="mem"></div>' +
    '<div class="meta"><span id="ends"></span><span id="pct"></span></div></section></div>' +
    '<section class="bandwrap" id="results"><div class="bandhead"><h2 class="label">Top 5 teams</h2><span class="label" id="rsub"></span></div>' +
    '<ol class="band" id="rows"></ol></section></div>' +
    '<div class="dock" id="dock"></div><aside class="drawer" id="drawer" aria-label="Organizer controls"></aside>';

  var seven = $('#seven');
  R.digits = [];
  for (var i = 0; i < 6; i++) {
    if (i === 2 || i === 4) {
      var c = el('div', 'colon');
      c.appendChild(el('i')); c.appendChild(el('i'));
      seven.appendChild(c);
    }
    var d = buildDigit();
    seven.appendChild(d);
    R.digits.push(d);
  }
  var mem = $('#mem');
  R.mem = [];
  for (var h = 0; h < 8; h++) {
    var sp = el('span'); var fill = el('i'); sp.appendChild(fill); mem.appendChild(sp); R.mem.push(fill);
  }
}

var STATUS_TEXT = { idle: 'Waiting for kickoff', running: 'Clock running', paused: 'Clock paused', ended: 'Time is up' };

function renderBoard(ci) {
  var rows = $('#rows'), sub = $('#rsub');
  rows.textContent = '';
  var show = ci.phase === 'ended' && S.revealed;
  var animate = false;
  if (show) {
    animate = R.live || !alreadySeen();
    sub.textContent = 'Final ranking';
  } else if (ci.phase === 'ended') {
    sub.textContent = 'Time is up. Judges are finalising the ranking.';
  } else {
    sub.textContent = 'Unlocks when the clock reaches zero';
  }
  for (var i = 0; i < 5; i++) {
    var team = (S.teams && S.teams[i]) || {};
    var li = el('li', 'cell' + (i === 0 ? ' first' : '') + (show ? '' : ' locked') + (animate ? ' reveal' : ''));
    if (animate) li.style.setProperty('--d', String((4 - i) * 0.9));
    li.appendChild(el('div', 'rk', String(i + 1)));
    var tx = el('div', 'tx');
    tx.appendChild(el('h3', null, show ? (team.name || 'Team to be announced') : ''));
    tx.appendChild(el('p', 'pj', show ? (team.project || '') : ''));
    if (show && team.members) tx.appendChild(el('p', 'mb', team.members));
    li.appendChild(tx);
    rows.appendChild(li);
  }
  if (animate) { markSeen(); R.live = false; }
}

function updatePhase(ci) {
  $('#led').className = 'led ' + (ci.phase === 'idle' ? '' : ci.phase);
  $('#stxt').textContent = STATUS_TEXT[ci.phase];
  $('#rbadge').hidden = S.clock.durationMs === REAL;
  $('#seven').classList.toggle('ended', ci.phase === 'ended');
  renderBoard(ci);
  if (R.onPhase) R.onPhase(ci);
}

function tick() {
  var now = Date.now();
  var ci = clockInfo(S, now);
  var p = hms(ci.remaining);
  var vals = [Math.floor(p[0] / 10), p[0] % 10, Math.floor(p[1] / 10), p[1] % 10, Math.floor(p[2] / 10), p[2] % 10];
  for (var i = 0; i < 6; i++) {
    if (R.last[i] !== vals[i]) { setDigit(R.digits[i], vals[i]); R.last[i] = vals[i]; }
  }
  var D = S.clock.durationMs, per = D / 8;
  for (var h = 0; h < 8; h++) {
    var f = Math.max(0, Math.min(1, (ci.elapsed - h * per) / per));
    R.mem[h].style.transform = 'scaleX(' + f.toFixed(3) + ')';
  }
  $('#pct').textContent = Math.floor(ci.elapsed / D * 100) + '% elapsed';
  var ends;
  if (ci.phase === 'running') {
    ends = 'Ends at ' + new Date(now + ci.remaining).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  } else if (ci.phase === 'paused') {
    ends = 'Paused by the organizers';
  } else if (ci.phase === 'ended') {
    ends = 'FINAL PULSES⚡';
  } else {
    ends = 'Starts when the organizers press start';
  }
  if (ends !== R.endsText) { $('#ends').textContent = ends; R.endsText = ends; }
  $('#seven').setAttribute('aria-label', 'Time remaining ' + pad2(p[0]) + ' hours ' + pad2(p[1]) + ' minutes ' + pad2(p[2]) + ' seconds');

  if (ci.phase !== R.phase) {
    if (R.phase === 'running' && ci.phase === 'ended') R.live = true;
    R.phase = ci.phase;
    updatePhase(ci);
  }
}
/* ---- organizer controls (only built for people who can publish this page) ---- */
function renderPanel(api) {
  var ci = clockInfo(S, Date.now());
  var d = $('#drawer');
  var draft = null;
  if ($('#tn0')) {
    draft = [];
    for (var q = 0; q < 5; q++) draft.push({ name: $('#tn' + q).value, project: $('#tp' + q).value, members: $('#tm' + q).value });
  }
  d.textContent = '';
  var oldBtn = $('#openCtl');
  if (oldBtn) oldBtn.remove();
  var head = el('div', 'dhead');
  head.appendChild(el('h2', null, 'Organizer controls'));
  var closeBtn = el('button', 'btn', 'Close'); closeBtn.type = 'button';
  closeBtn.addEventListener('click', function () { setDrawer(false); });
  head.appendChild(closeBtn);
  d.appendChild(head);
  var g = el('div', 'pgrid');
  d.appendChild(g);
  var allBtns = [];
  var msg = el('div', 'msg'); msg.setAttribute('aria-live', 'polite');

  function btn(label, cls, fn) {
    var b = el('button', 'btn' + (cls ? ' ' + cls : ''), label);
    b.type = 'button';
    b.addEventListener('click', function () { fn(b); });
    allBtns.push(b);
    return b;
  }
  function collectTeams() {
    var out = [];
    for (var i = 0; i < 5; i++) {
      out.push({
        name: $('#tn' + i).value.trim(),
        project: $('#tp' + i).value.trim(),
        members: $('#tm' + i).value.trim()
      });
    }
    return out;
  }
  function mutate(fn) {
    var n = JSON.parse(JSON.stringify(S));
    n.teams = collectTeams();
    fn(n);
    return n;
  }
  function publish(n) {
    msg.textContent = 'Publishing...';
    allBtns.forEach(function (b) { b.disabled = true; });
    return api.publish(buildDoc(n)).then(function () {
      msg.textContent = 'Published. Reloading the page.';
    }, function (e) {
      var code = e && e.code;
      if (code === 'conflict') msg.textContent = 'Someone published first. Loading the latest version.';
      else if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required') msg.textContent = 'This view is read-only, so changes cannot be published.';
      else if (code === 'rate_limited') msg.textContent = 'Too many changes in a row. Wait a few seconds and try again.';
      else msg.textContent = 'Could not publish (' + (code || 'error') + '). Try again.';
      allBtns.forEach(function (b) { b.disabled = false; });
    });
  }

  /* clock */
  var cbox = el('div');
  cbox.appendChild(el('div', 'label', 'Clock'));
  var row = el('div', 'btns'); row.style.marginTop = '10px';
  if (ci.phase === 'idle') {
    row.appendChild(btn('Start clock', 'primary', function () {
      publish(mutate(function (n) { n.clock.status = 'running'; n.clock.startedAt = Date.now(); n.clock.elapsedMs = 0; n.revealed = false; }));
    }));
    var sel = el('select'); sel.id = 'mode'; sel.setAttribute('aria-label', 'Clock length');
    var o1 = el('option', null, 'Event: 8 hours'); o1.value = String(REAL);
    var o2 = el('option', null, 'Rehearsal: 30 seconds'); o2.value = String(REHEARSAL);
    sel.appendChild(o1); sel.appendChild(o2);
    sel.value = String(S.clock.durationMs);
    sel.style.width = 'auto';
    sel.addEventListener('change', function () {
      publish(mutate(function (n) { n.clock.durationMs = Number(sel.value); }));
    });
    row.appendChild(sel);
  } else if (ci.phase === 'running') {
    row.appendChild(btn('Pause', null, function () {
      publish(mutate(function (n) { n.clock.elapsedMs = clockInfo(S, Date.now()).elapsed; n.clock.startedAt = null; n.clock.status = 'paused'; }));
    }));
  } else if (ci.phase === 'paused') {
    row.appendChild(btn('Resume', 'primary', function () {
      publish(mutate(function (n) { n.clock.startedAt = Date.now(); n.clock.status = 'running'; }));
    }));
  }
  if (ci.phase !== 'idle') {
    var armed = false, timer = null;
    row.appendChild(btn('Reset clock', 'warn', function (b) {
      if (!armed) {
        armed = true; b.textContent = 'Tap again to reset'; b.classList.add('armed');
        timer = setTimeout(function () { armed = false; b.textContent = 'Reset clock'; b.classList.remove('armed'); }, 3000);
        return;
      }
      clearTimeout(timer);
      publish(mutate(function (n) { n.clock.status = 'idle'; n.clock.startedAt = null; n.clock.elapsedMs = 0; n.revealed = false; }));
    }));
  }
  cbox.appendChild(row);
  g.appendChild(cbox);

  /* teams */
  var tbox = el('div');
  tbox.appendChild(el('div', 'label', 'Top 5 teams, first place on the first row'));
  var tg = el('div', 'tgrid'); tg.style.marginTop = '10px';
  for (var i = 0; i < 5; i++) {
    var t = (draft && draft[i]) || (S.teams && S.teams[i]) || {};
    var r = el('div', 'trow');
    r.appendChild(el('b', null, String(i + 1)));
    [['tn', 'Team name', t.name], ['tp', 'Project title', t.project], ['tm', 'Members', t.members]].forEach(function (f) {
      var inp = el('input'); inp.type = 'text'; inp.id = f[0] + i; inp.placeholder = f[1];
      inp.setAttribute('aria-label', f[1] + ' for place ' + (i + 1)); inp.maxLength = 120;
      inp.value = f[2] || '';
      r.appendChild(inp);
    });
    tg.appendChild(r);
  }
  tbox.appendChild(tg);
  var trow = el('div', 'btns'); trow.style.marginTop = '14px';
  trow.appendChild(btn('Save teams', 'primary', function () { publish(mutate(function () {})); }));
  trow.appendChild(btn(S.revealed ? 'Hide results' : 'Reveal results', null, function () {
    publish(mutate(function (n) { n.revealed = !S.revealed; if (n.revealed) n.revealId = Date.now(); }));
  }));
  trow.appendChild(btn('Fill sample names', null, function () {
    var s = ['Team Alpha', 'Team Bravo', 'Team Charlie', 'Team Delta', 'Team Echo'];
    for (var k = 0; k < 5; k++) { $('#tn' + k).value = s[k]; $('#tp' + k).value = 'Sample project ' + (k + 1); }
    msg.textContent = 'Sample names filled in. They are not published until you press Save teams.';
  }));
  tbox.appendChild(trow);
  g.appendChild(tbox);

  var help = el('p', 'msg', 'Viewers see the top 5 only after the clock reaches zero and you press Reveal results. Use the 30-second rehearsal to test the whole flow, then switch back to the 8-hour event clock. On the projector press F for fullscreen and C for these controls.');
  g.appendChild(help);
  g.appendChild(msg);
  var openBtn = el('button', 'btn primary', 'Controls'); openBtn.type = 'button'; openBtn.id = 'openCtl';
  openBtn.addEventListener('click', function () { setDrawer(true); });
  $('#dock').appendChild(openBtn);
}



/* ---- standalone mode: the clock and team names are saved in this browser, controls are always available ---- */
var STORE_KEY = 'embedathon-2k26-state-v1';
function buildDoc(state) { return state; }

function loadSaved() {
  try {
    var v = JSON.parse(localStorage.getItem(STORE_KEY));
    if (v && v.clock && v.teams) return v;
  } catch (e) {}
  return null;
}
function saveState(n) { try { localStorage.setItem(STORE_KEY, JSON.stringify(n)); } catch (e) {} }

/* ---- projector helpers: fullscreen, theme, auto-hiding buttons, keyboard shortcuts ---- */
function drawerOpen() { var d = $('#drawer'); return !!d && d.classList.contains('open'); }
function setDrawer(on) {
  var d = $('#drawer');
  if (!d) return;
  d.classList.toggle('open', on);
  if (on) document.body.classList.remove('idle');
}
function toggleFullscreen() {
  try {
    var de = document.documentElement;
    if (document.fullscreenElement) { document.exitFullscreen().catch(function () {}); }
    else if (de.requestFullscreen) { de.requestFullscreen().catch(function () {}); }
  } catch (e) {}
}
function toggleTheme() {
  var r = document.documentElement;
  var cur = r.getAttribute('data-theme');
  if (!cur) cur = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  var next = cur === 'dark' ? 'light' : 'dark';
  r.setAttribute('data-theme', next);
  try { localStorage.setItem(STORE_KEY + '-theme', next); } catch (e) {}
}
function addFullscreenButton() {
  var b = el('button', 'btn', 'Fullscreen'); b.type = 'button'; b.id = 'fsBtn';
  if (document.fullscreenEnabled === false) b.hidden = true;
  b.addEventListener('click', toggleFullscreen);
  $('#dock').appendChild(b);
}

var localApi = {
  publish: function (n) {
    var wasIdle = clockInfo(S, Date.now()).phase === 'idle';
    var keepOpen = drawerOpen() && !(wasIdle && n.clock.status === 'running');
    S = n;
    saveState(n);
    mountUI(keepOpen);
    return Promise.resolve({ version: 'local' });
  }
};

function mountUI(reopen) {
  renderShell();
  R.phase = null; R.last = []; R.endsText = '';
  R.onPhase = function () { renderPanel(localApi); };
  tick();
  addFullscreenButton();
  renderPanel(localApi);
  if (reopen) setDrawer(true);
}

var bound = false;
function bindOnce() {
  if (bound) return;
  bound = true;
  var t = null;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(t);
    t = setTimeout(function () { if (!drawerOpen()) document.body.classList.add('idle'); }, 3500);
  }
  ['mousemove', 'keydown', 'touchstart', 'click'].forEach(function (ev) { document.addEventListener(ev, wake, { passive: true }); });
  document.addEventListener('keydown', function (e) {
    if (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) { if (e.key === 'Escape') setDrawer(false); return; }
    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    else if (e.key === 'c' || e.key === 'C') setDrawer(!drawerOpen());
    else if (e.key === 't' || e.key === 'T') toggleTheme();
    else if (e.key === 'Escape') setDrawer(false);
  });
  /* a second window of this same file (for example the organizer's) changes the display window live */
  window.addEventListener('storage', function (e) {
    if (e.key !== STORE_KEY) return;
    var v = loadSaved();
    if (v) { var open = drawerOpen(); S = v; mountUI(open); }
  });
  wake();
}

/* ---- start ---- */
(function () {
  var saved = loadSaved();
  if (saved) S = saved;
  try {
    var th = localStorage.getItem(STORE_KEY + '-theme');
    if (th === 'dark' || th === 'light') document.documentElement.setAttribute('data-theme', th);
  } catch (e) {}
  mountUI(false);
  bindOnce();
  setInterval(tick, 250);
})();
})();
</script>
